<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A dynamic, premium task management application with local storage persistence, task status tracking, and beautiful UI." />
  <title>Taskify — Dynamic To-Do App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Animated background blobs -->
  <div class="bg-blob blob-1" aria-hidden="true"></div>
  <div class="bg-blob blob-2" aria-hidden="true"></div>
  <div class="bg-blob blob-3" aria-hidden="true"></div>

  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="logo">
        <span class="logo-icon">✦</span>
        <h1>Taskify</h1>
      </div>
      <p class="tagline">Stay organized. Get things done.</p>
      <!-- Stats bar -->
      <div class="stats-bar">
        <div class="stat" id="stat-total">
          <span class="stat-number">0</span>
          <span class="stat-label">Total</span>
        </div>
        <div class="stat" id="stat-active">
          <span class="stat-number">0</span>
          <span class="stat-label">Active</span>
        </div>
        <div class="stat" id="stat-completed">
          <span class="stat-number">0</span>
          <span class="stat-label">Done</span>
        </div>
      </div>
    </header>

    <!-- Task Input -->
    <section class="input-section">
      <form id="task-form" autocomplete="off">
        <div class="input-wrapper">
          <span class="input-icon" aria-hidden="true">＋</span>
          <input
            type="text"
            id="task-input"
            placeholder="What needs to be done?"
            maxlength="120"
            required
          />
          <button type="submit" id="add-btn" aria-label="Add task">
            Add
            <span class="btn-shine" aria-hidden="true"></span>
          </button>
        </div>
      </form>
    </section>

    <!-- Filter Tabs -->
    <nav class="filter-tabs" aria-label="Task filters">
      <button class="filter-btn active" data-filter="all" id="filter-all">All</button>
      <button class="filter-btn" data-filter="active" id="filter-active">Active</button>
      <button class="filter-btn" data-filter="completed" id="filter-completed">Completed</button>
    </nav>

    <!-- Task List -->
    <main>
      <ul id="task-list" class="task-list" aria-label="Tasks"></ul>
      <!-- Empty state -->
      <div id="empty-state" class="empty-state">
        <div class="empty-icon" aria-hidden="true">📋</div>
        <p class="empty-title">No tasks yet</p>
        <p class="empty-subtitle">Add a task above to get started!</p>
      </div>
    </main>

    <!-- Footer actions -->
    <footer class="app-footer" id="app-footer">
      <span id="items-left" class="items-left">0 items left</span>
      <button id="clear-completed" class="clear-btn">Clear Completed</button>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
